<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Green Turtle - Launching Soon! Your eco-friendly marketplace."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Green Turtle</title>
    <!-- Tailwind CSS CDN - IMPORTANT: In a Create React App, Tailwind is typically set up via PostCSS.
         For simplicity and quick preview in Canvas, we're using CDN here.
         For a full local setup, you'd install Tailwind CLI/PostCSS.
         If you want to use Tailwind CLI, you'd run `npx tailwindcss init -p` and configure `tailwind.config.js`
         and import it in your `index.css` (which you'd also create).
         For now, we'll rely on the CDN for quick setup.
    -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts - Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc; /* Light blue-gray background */
        }
        /* Custom scrollbar for a cleaner look */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #e2e8f0;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #34d399; /* Green-500 */
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #10b981; /* Green-600 */
        }
    </style>
</head>
<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
    <script>
      const defaultTitle = document.title;
      const creativeTitles = [
        "Take your first step! 🌱",
        "Waiting for you... 🐢",
        "Come back, we miss you! 💚"
      ];
      let titleIndex = 0;

      window.addEventListener('blur', () => {
        titleIndex = (titleIndex + 1) % creativeTitles.length;
        document.title = creativeTitles[titleIndex];
      });

      window.addEventListener('focus', () => {
        document.title = defaultTitle;
      });
    </script>
</body>
</html>
